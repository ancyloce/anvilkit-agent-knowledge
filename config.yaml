# Reviewed configuration of anvilkit-agent-knowledge (DD-09 §4): the
# secret-free, placement-free part of a configuration generation. Precedence
# is defaults < this file < a validated Apollo snapshot (non-secret keys,
# ANVILKIT_KNOWLEDGE_APOLLO_SNAPSHOT_FILE with apollo.mode: snapshot) < the
# allowlisted environment: ANVILKIT_KNOWLEDGE_LISTEN,
# ANVILKIT_KNOWLEDGE_HEALTH_LISTEN, ANVILKIT_KNOWLEDGE_IDENTITY_{CERT,KEY,CA}_FILE,
# ANVILKIT_KNOWLEDGE_IDENTITY_TRUST_DOMAIN, ANVILKIT_KNOWLEDGE_DATABASE_URL or
# ANVILKIT_KNOWLEDGE_DATABASE_URL_FILE (the secret, environment or mounted
# file only), ANVILKIT_KNOWLEDGE_CONTROL_ADDRESS,
# ANVILKIT_KNOWLEDGE_APOLLO_SNAPSHOT_FILE and the placements named in the
# sections below. Any other ANVILKIT_KNOWLEDGE_*
# variable, any unknown key here and any secret or placement key here
# rejects the candidate before anything starts.
#
# P14 scope: the BackgroundTaskService owner (claims, heartbeats, result
# acceptance, lease sweep, cancellation) and the transactional outbox; the
# Go forwarder sidecar (forwarder/) reads it. Sources, ingestion, retrieval
# and MemoryFact arrive with P15-P17. DEVELOPMENT_ONLY bounds below are not
# production capacity.
# development: the top-level DEVELOPMENT_ONLY guard (P0.1). This checked-in
# file configures host-side runs on the development foundation
# (deploy/dev), whose Inference and OTLP endpoints are plaintext; every
# plaintext connection below names its own development mode as well. The
# guard downgrades nothing by itself: the gRPC listener and the Control
# client stay mTLS. Outside development (P0.6) every PostgreSQL URL must
# carry sslmode=verify-full (the CA through sslrootcert) and the object
# stores (objects, removals) and Qdrant must be https:// (their CA from
# the default roots with NODE_EXTRA_CA_CERTS); the foundation's plaintext
# endpoints are admitted only under this guard. The chart renders its own
# file with the guard off.
development:
  enabled: true
grpc:
  listen: 127.0.0.1:9105
  capacity: 64
  shutdown_timeout: 20s
  # identity: the listener's workload identity (P0.1). mtls serves TLS 1.3
  # with required, verified client certificates and authorizes every RPC by
  # the peer's SPIFFE URI SAN under trust_domain; the files are placements
  # (ANVILKIT_KNOWLEDGE_IDENTITY_{CERT,KEY,CA}_FILE, .local/dev/certs on the
  # foundation) watched and reloaded as a whole. development is plaintext
  # and authorizes nothing (requires development.enabled).
  identity:
    mode: mtls
    trust_domain: anvilkit.local
    max_connection_age: 1h
    reload_interval: 5s
health:
  listen: 127.0.0.1:9115
database:
  max_conn: 8
tasks:
  max_input_bytes: 65536
  max_lease: 10m
  retry_delay: 5s
  max_attempts: 3
  sweep_interval: 2s
outbox:
  # The forwarder sidecar's consumer group: the offsets row it owns; the
  # oldest-unforwarded metric of this service reads that row.
  consumer_group: anvilkit-agent-knowledge-forwarder
control:
  timeout: 5s
  # identity: the Control client presents the workload certificate and
  # verifies Control by server_name (a DNS SAN of its certificate).
  identity:
    mode: mtls
    server_name: anvilkit-agent-control
apollo:
  mode: disabled
  app_id: anvilkit-agent-knowledge
reload:
  interval: 2s
  drain_limit: 30s
# P15: the Source Registry's bound, the parser launcher and the Inference
# profile. Placements and secrets come from the environment only:
# ANVILKIT_KNOWLEDGE_OBJECTS_{ENDPOINT,STAGE_ENDPOINT,ACCESS_KEY_ID,
# SECRET_ACCESS_KEY,CREDENTIALS_FILE}, ANVILKIT_KNOWLEDGE_KUBECONFIG,
# ANVILKIT_KNOWLEDGE_IMAGE_REGISTRY, ANVILKIT_KNOWLEDGE_INFERENCE_URL.
# parser.profile names a reviewed parser profile of contracts/jobs; empty
# disables registration and parsing.
objects:
  bucket: anvilkit-knowledge
  region: us-east-1
sources:
  max_bytes: 33554432
  # P2.6: how long a BeginUpload capability may be used (the presigned PUT
  # and the registration that consumes it); [1m, 1h].
  upload_ttl: 15m
parser:
  profile: ""
  namespace: anvilkit-parsing
  node_pool: parsing
  seccomp_profile: anvilkit/candidate.json
  poll_interval: 1s
  deadline_grace: 30s
  presign_ttl: 15m
  kube_timeout: 10s
inference:
  # tls: the Inference transport; development is the foundation's plaintext
  # http:// (DEVELOPMENT_ONLY, needs development.enabled), tls verifies the
  # server against ca_file by server_name, mtls also presents the workload
  # certificate (server-side TLS of Inference is P0.6).
  tls:
    mode: development
  timeout: 30s
  max_batch: 32
  embedding_profile: bge-m3-v1
  embedding_revision: 5617a9f61b028005a4858fdac845db406aefb181
  dimensions: 1024
  rerank_profile: bge-reranker-v2-m3-v1
  rerank_revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
  # P2.7: an embedding-model change sets the new profile above and places
  # the Inference deployment that still loads the earlier model as
  # ANVILKIT_KNOWLEDGE_INFERENCE_RETAINED_URL (same transport as inference.tls;
  # server_name defaults to its URL host), with that model's complete space:
  #   retained:
  #     embedding_profile: bge-m3-v1
  #     embedding_revision: 5617a9f61b028005a4858fdac845db406aefb181
  #     dimensions: 1024
  #     sparse_profile: bge-m3-lexical-v1
  # The accepted generation keeps serving with it until the generation of the
  # new profile is accepted; then the retained placement is removed.
# P16: the vector projection and hybrid retrieval (DD-07 §3/§4). The Qdrant
# placement and API key come from the environment only
# (ANVILKIT_KNOWLEDGE_QDRANT_URL, and ANVILKIT_KNOWLEDGE_QDRANT_API_KEY or the
# mounted secret file ANVILKIT_KNOWLEDGE_QDRANT_API_KEY_FILE, not both);
# without them nothing is indexed or retrieved. Replication 1/1 and the retrieval
# bounds below are DEVELOPMENT_ONLY (the production layout is RF=3/WCF=2,
# platform.md); min_rerank_score is the development profile's no-answer
# floor, not a qualified quality threshold.
qdrant:
  timeout: 10s
  replication_factor: 1
  write_consistency_factor: 1
  write_ordering: strong
  read_consistency: all
index:
  sparse_profile: bge-m3-lexical-v1
  batch_size: 16
  # P2.7: at least the parser profile's maxOutputBytes (33554432 for
  # parser-docling-v1/-dev-v1); a smaller bound is refused at start, since an
  # accepted parse larger than it could never be indexed.
  max_result_bytes: 33554432
  # P2.7: a failed entry of a still-eligible revision is attempted again
  # after retry_delay, at most max_attempts times, then quarantined.
  max_attempts: 3
  retry_delay: 5m
  # P2.7: the accepted generation's document points are counted against its
  # ledger this often; missing points (a deleted collection) are a metric and
  # an error (search answers UNAVAILABLE), repaired by
  # `knowledgectl rebuild documents`.
  count_check_interval: 10m
  poll_interval: 200ms
  qualify_interval: 2s
retrieval:
  profile_id: hybrid-bge-m3-dev-v1
  dense_limit: 40
  sparse_limit: 40
  rrf_k: 60
  fused_limit: 40
  rerank_limit: 16
  max_context_chars: 16000
  max_allowed_sources: 256
  min_rerank_score: "0"
  max_deadline: 60s
# P17: MemoryFact and its projections (DD-07 §5). The PostgresStore
# projection lives in its own vendor schema, prepared by the Store's own
# migrations under a separate identity (dist/storemigrate.js) and used here
# with ensureTables: false through its own pool; the runtime Store role's URL
# is environment-only (ANVILKIT_KNOWLEDGE_STORE_DATABASE_URL or the mounted
# secret file ANVILKIT_KNOWLEDGE_STORE_DATABASE_URL_FILE, not both; the
# migration takes ANVILKIT_KNOWLEDGE_STORE_MIGRATION_URL or _URL_FILE and
# admits a plaintext URL only with
# ANVILKIT_KNOWLEDGE_STORE_MIGRATION_DEVELOPMENT=true). Without it no
# fact is projected to the Store (the projection tasks fail and are retried
# by reconciliation). Semantic recall uses the vector generations of the
# retrieval profile above; max_allowed_facts bounds the allowed-fact set of
# one recall (a larger set is refused, never truncated). DEVELOPMENT_ONLY
# bounds.
# P2.7: the cleanup identity's work (its URL is ANVILKIT_KNOWLEDGE_CLEANUP_DATABASE_URL
# or _FILE, environment only): the erasure of deleted sources (upload,
# unshared content-addressed copy, parse results, chunk rows, after the
# indexer removed their points) and the retention of delivery rows, on the
# one replica that holds the reconciler lock. Retention must exceed the
# stream's redelivery horizon for the inbox.
cleanup:
  interval: 10m
  batch: 1000
  outbox_retention: 168h
  inbox_retention: 720h
  attempts_retention: 720h
  launches_retention: 720h
store:
  schema: memory_store
  max_conn: 4
memory:
  max_allowed_facts: 1024
  max_projection_epochs: 5
  retry_delay: 30s
# P23: the removal inventory (contracts.md §3, platform.md §6). Every memory
# deletion and revocation is answered only once its immutable record is in
# this bucket of the independent DR store (its own user and bucket-limited
# policy, never the objects bucket); after a restore of anvilkit_knowledge,
# memory serves again only once every record past the database's newest
# removal (less window_margin, the commit-order and clock margin) is
# re-applied. The endpoint and the credentials file are environment-only
# (ANVILKIT_KNOWLEDGE_REMOVALS_ENDPOINT, ANVILKIT_KNOWLEDGE_REMOVALS_CREDENTIALS_FILE);
# unplaced, removals are not preserved across a restore and the service
# warns. DEVELOPMENT_ONLY bounds.
removals:
  bucket: anvilkit-memory-removals
  region: us-east-1
  timeout: 10s
  window_margin: 5m
  reconcile_interval: 30s
