# Reviewed configuration of anvilkit-agent-knowledge (DD-09 §4): the
# secret-free, placement-free part of a configuration generation. Precedence
# is defaults < this file < a validated Apollo snapshot (non-secret keys,
# ANVILKIT_KNOWLEDGE_APOLLO_SNAPSHOT_FILE with apollo.mode: snapshot) < the
# allowlisted environment: ANVILKIT_KNOWLEDGE_LISTEN,
# ANVILKIT_KNOWLEDGE_HEALTH_LISTEN, ANVILKIT_KNOWLEDGE_DATABASE_URL or
# ANVILKIT_KNOWLEDGE_DATABASE_URL_FILE (the secret, environment or mounted
# file only), ANVILKIT_KNOWLEDGE_CONTROL_ADDRESS,
# ANVILKIT_KNOWLEDGE_APOLLO_SNAPSHOT_FILE. Any other ANVILKIT_KNOWLEDGE_*
# variable, any unknown key here and any secret or placement key here
# rejects the candidate before anything starts.
#
# P14 scope: the BackgroundTaskService owner (claims, heartbeats, result
# acceptance, lease sweep, cancellation) and the transactional outbox; the
# Go forwarder sidecar (forwarder/) reads it. Sources, ingestion, retrieval
# and MemoryFact arrive with P15-P17. DEVELOPMENT_ONLY bounds below are not
# production capacity.
grpc:
  listen: 127.0.0.1:9105
  capacity: 64
  shutdown_timeout: 20s
health:
  listen: 127.0.0.1:9115
database:
  max_conn: 8
tasks:
  max_input_bytes: 65536
  max_lease: 10m
  retry_delay: 5s
  max_attempts: 3
  sweep_interval: 2s
outbox:
  # The forwarder sidecar's consumer group: the offsets row it owns; the
  # oldest-unforwarded metric of this service reads that row.
  consumer_group: anvilkit-agent-knowledge-forwarder
control:
  timeout: 5s
apollo:
  mode: disabled
  app_id: anvilkit-agent-knowledge
reload:
  interval: 2s
  drain_limit: 30s
# P15: the Source Registry's bound, the parser launcher and the Inference
# profile. Placements and secrets come from the environment only:
# ANVILKIT_KNOWLEDGE_OBJECTS_{ENDPOINT,STAGE_ENDPOINT,ACCESS_KEY_ID,
# SECRET_ACCESS_KEY,CREDENTIALS_FILE}, ANVILKIT_KNOWLEDGE_KUBECONFIG,
# ANVILKIT_KNOWLEDGE_IMAGE_REGISTRY, ANVILKIT_KNOWLEDGE_INFERENCE_URL.
# parser.profile names a reviewed parser profile of contracts/jobs; empty
# disables registration and parsing.
objects:
  bucket: anvilkit-knowledge
  region: us-east-1
sources:
  max_bytes: 33554432
parser:
  profile: ""
  namespace: anvilkit-parsing
  node_pool: parsing
  seccomp_profile: anvilkit/candidate.json
  poll_interval: 1s
  deadline_grace: 30s
  presign_ttl: 15m
  kube_timeout: 10s
inference:
  timeout: 30s
  max_batch: 32
  embedding_profile: bge-m3-v1
  embedding_revision: 5617a9f61b028005a4858fdac845db406aefb181
  dimensions: 1024
  rerank_profile: bge-reranker-v2-m3-v1
  rerank_revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
# P16: the vector projection and hybrid retrieval (DD-07 §3/§4). The Qdrant
# placement and API key come from the environment only
# (ANVILKIT_KNOWLEDGE_QDRANT_URL, ANVILKIT_KNOWLEDGE_QDRANT_API_KEY); without
# them nothing is indexed or retrieved. Replication 1/1 and the retrieval
# bounds below are DEVELOPMENT_ONLY (the production layout is RF=3/WCF=2,
# platform.md); min_rerank_score is the development profile's no-answer
# floor, not a qualified quality threshold.
qdrant:
  timeout: 10s
  replication_factor: 1
  write_consistency_factor: 1
  write_ordering: strong
  read_consistency: all
index:
  sparse_profile: bge-m3-lexical-v1
  batch_size: 16
  max_result_bytes: 16777216
  poll_interval: 200ms
  qualify_interval: 2s
retrieval:
  profile_id: hybrid-bge-m3-dev-v1
  dense_limit: 40
  sparse_limit: 40
  rrf_k: 60
  fused_limit: 40
  rerank_limit: 16
  max_context_chars: 16000
  max_allowed_sources: 256
  min_rerank_score: "0"
  max_deadline: 60s
# P17: MemoryFact and its projections (DD-07 §5). The PostgresStore
# projection lives in its own vendor schema, prepared by the Store's own
# migrations under a separate identity (dist/storemigrate.js) and used here
# with ensureTables: false through its own pool; the runtime Store role's URL
# is environment-only (ANVILKIT_KNOWLEDGE_STORE_DATABASE_URL). Without it no
# fact is projected to the Store (the projection tasks fail and are retried
# by reconciliation). Semantic recall uses the vector generations of the
# retrieval profile above; max_allowed_facts bounds the allowed-fact set of
# one recall (a larger set is refused, never truncated). DEVELOPMENT_ONLY
# bounds.
store:
  schema: memory_store
  max_conn: 4
memory:
  max_allowed_facts: 1024
  max_projection_epochs: 5
  retry_delay: 30s
