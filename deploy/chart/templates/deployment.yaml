{{- include "anvilkit-agent-knowledge.require" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvilkit-agent-knowledge.fullname" . }}
  labels:
    {{- include "anvilkit-agent-knowledge.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "anvilkit-agent-knowledge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anvilkit-agent-knowledge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: knowledge
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "anvilkit-agent-knowledge.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "anvilkit-agent-knowledge.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # No injected service-link variables: the configuration loader rejects
      # any ANVILKIT_KNOWLEDGE_* variable outside its allowlist.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: knowledge
          image: {{ include "anvilkit-agent-knowledge.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ANVILKIT_KNOWLEDGE_CONFIG
              value: /etc/anvilkit/anvilkit-agent-knowledge/config.yaml
            - name: ANVILKIT_KNOWLEDGE_LISTEN
              value: {{ printf "%s:%d" .Values.listen.address (int .Values.listen.port) | quote }}
            - name: ANVILKIT_KNOWLEDGE_HEALTH_LISTEN
              value: {{ printf "%s:%d" .Values.listen.address (int .Values.health.port) | quote }}
            {{- if .Values.telemetry.otlpEndpoint }}
            - name: ANVILKIT_KNOWLEDGE_TELEMETRY_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            {{- end }}
            # The secret as a mounted file: the kubelet refreshes it when the
            # Secret changes and the generation watcher publishes the new
            # generation (a new pool, probed, then the old one drained).
            {{- $csi := eq .Values.secrets.provider "csi" }}
            {{- if .Values.trust.configMap }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/anvilkit/trust/ca.crt
            {{- end }}
            - name: ANVILKIT_KNOWLEDGE_DATABASE_URL_FILE
              value: {{ include "anvilkit-agent-knowledge.credentialFile" (dict "root" . "csi" "database-url" "kube" (printf "/var/run/secrets/anvilkit/database/%s" .Values.database.secret.key)) }}
            {{- if eq .Values.identity.mode "mtls" }}
            - name: ANVILKIT_KNOWLEDGE_IDENTITY_CERT_FILE
              value: /etc/anvilkit/identity/tls.crt
            - name: ANVILKIT_KNOWLEDGE_IDENTITY_KEY_FILE
              value: /etc/anvilkit/identity/tls.key
            - name: ANVILKIT_KNOWLEDGE_IDENTITY_CA_FILE
              value: /etc/anvilkit/identity/ca.crt
            {{- end }}
            {{- if .Values.identity.trustDomain }}
            - name: ANVILKIT_KNOWLEDGE_IDENTITY_TRUST_DOMAIN
              value: {{ .Values.identity.trustDomain | quote }}
            {{- end }}
            {{- if .Values.control.address }}
            - name: ANVILKIT_KNOWLEDGE_CONTROL_ADDRESS
              value: {{ .Values.control.address | quote }}
            {{- end }}
            {{- if .Values.objects.endpoint }}
            # P15: Knowledge's object store (its own user and bucket-limited
            # policy; the credentials as a mounted KEY=VALUE file) and the
            # endpoint parser Pods reach through their presigned URLs.
            - name: ANVILKIT_KNOWLEDGE_OBJECTS_ENDPOINT
              value: {{ .Values.objects.endpoint | quote }}
            - name: ANVILKIT_KNOWLEDGE_OBJECTS_STAGE_ENDPOINT
              value: {{ .Values.objects.stageEndpoint | default .Values.objects.endpoint | quote }}
            - name: ANVILKIT_KNOWLEDGE_OBJECTS_CREDENTIALS_FILE
              value: {{ include "anvilkit-agent-knowledge.credentialFile" (dict "root" . "csi" "objects-credentials" "kube" (printf "/var/run/secrets/anvilkit/objects/%s" .Values.objects.credentials.secret.key)) }}
            {{- end }}
            {{- if .Values.removals.endpoint }}
            # P23: the removal inventory in the independent DR store (its own
            # user and bucket-limited policy; the credentials as a mounted
            # KEY=VALUE file).
            - name: ANVILKIT_KNOWLEDGE_REMOVALS_ENDPOINT
              value: {{ .Values.removals.endpoint | quote }}
            - name: ANVILKIT_KNOWLEDGE_REMOVALS_CREDENTIALS_FILE
              value: {{ include "anvilkit-agent-knowledge.credentialFile" (dict "root" . "csi" "removals-credentials" "kube" (printf "/var/run/secrets/anvilkit/removals/%s" .Values.removals.credentials.secret.key)) }}
            {{- end }}
            {{- if .Values.parser.enabled }}
            - name: ANVILKIT_KNOWLEDGE_IMAGE_REGISTRY
              value: {{ .Values.parser.imageRegistry | quote }}
            {{- end }}
            {{- if .Values.inference.url }}
            - name: ANVILKIT_KNOWLEDGE_INFERENCE_URL
              value: {{ .Values.inference.url | quote }}
            {{- end }}
            {{- if .Values.qdrant.url }}
            - name: ANVILKIT_KNOWLEDGE_QDRANT_URL
              value: {{ .Values.qdrant.url | quote }}
            {{- end }}
            {{- if and $csi .Values.qdrant.url }}
            - name: ANVILKIT_KNOWLEDGE_QDRANT_API_KEY_FILE
              value: /var/run/secrets/anvilkit/csi/qdrant-api-key
            {{- else if and (not $csi) .Values.qdrant.apiKeySecret.name }}
            - name: ANVILKIT_KNOWLEDGE_QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qdrant.apiKeySecret.name }}
                  key: {{ .Values.qdrant.apiKeySecret.key }}
            {{- end }}
            {{- if and $csi .Values.store.enabled }}
            - name: ANVILKIT_KNOWLEDGE_STORE_DATABASE_URL_FILE
              value: /var/run/secrets/anvilkit/csi/store-database-url
            {{- else if and (not $csi) .Values.store.secret.name }}
            - name: ANVILKIT_KNOWLEDGE_STORE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.secret.name }}
                  key: {{ .Values.store.secret.key }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.listen.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/anvilkit/anvilkit-agent-knowledge
              readOnly: true
            {{- if .Values.trust.configMap }}
            - name: trust
              mountPath: /etc/anvilkit/trust
              readOnly: true
            {{- end }}
            {{- if $csi }}
            - name: credentials
              mountPath: /var/run/secrets/anvilkit/csi
              readOnly: true
            {{- else }}
            - name: database
              mountPath: /var/run/secrets/anvilkit/database
              readOnly: true
            {{- end }}
            {{- if eq .Values.identity.mode "mtls" }}
            - name: identity
              mountPath: /etc/anvilkit/identity
              readOnly: true
            {{- end }}
            {{- if and .Values.inference.url (ne .Values.inference.tls.mode "development") }}
            - name: inference-ca
              mountPath: /etc/anvilkit/inference-ca
              readOnly: true
            {{- end }}
            {{- if and (not $csi) .Values.objects.endpoint }}
            - name: objects
              mountPath: /var/run/secrets/anvilkit/objects
              readOnly: true
            {{- end }}
            {{- if and (not $csi) .Values.removals.endpoint }}
            - name: removals
              mountPath: /var/run/secrets/anvilkit/removals
              readOnly: true
            {{- end }}
            {{- if .Values.parser.enabled }}
            # The launcher's API credential: a projected, expiring token for
            # this container only (the Pod's automount stays off, so the
            # sidecars have none).
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
        {{- if .Values.forwarder.enabled }}
        - name: forwarder
          image: {{ include "anvilkit-agent-knowledge.forwarderImage" . | quote }}
          imagePullPolicy: {{ .Values.forwarder.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ANVILKIT_FORWARDER_DATABASE_URL_FILE
              value: {{ include "anvilkit-agent-knowledge.credentialFile" (dict "root" . "csi" "forwarder-database-url" "kube" (printf "/var/run/secrets/anvilkit/forwarder-database/%s" .Values.forwarder.database.secret.key)) }}
            {{- if or $csi .Values.nats.credentials.secret.name }}
            - name: ANVILKIT_FORWARDER_NATS_CREDS_FILE
              value: {{ include "anvilkit-agent-knowledge.credentialFile" (dict "root" . "csi" "nats-creds" "kube" (printf "/var/run/secrets/anvilkit/nats/%s" .Values.nats.credentials.secret.forwarderKey)) }}
            {{- end }}
            {{- if .Values.trust.configMap }}
            # Go: the trust bundle beside the image's roots (the DSN's sslrootcert names it too).
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/anvilkit/trust
            {{- end }}
            - name: ANVILKIT_FORWARDER_NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: ANVILKIT_FORWARDER_CONSUMER_GROUP
              value: {{ .Values.forwarder.consumerGroup | quote }}
            - name: ANVILKIT_FORWARDER_HEALTH_LISTEN
              value: {{ printf "%s:%d" .Values.listen.address (int .Values.forwarder.healthPort) | quote }}
            - name: ANVILKIT_FORWARDER_NATS_TLS_MODE
              value: {{ .Values.nats.tls.mode | quote }}
            {{- if eq .Values.nats.tls.mode "development" }}
            - name: ANVILKIT_FORWARDER_DEVELOPMENT_ENABLED
              value: "true"
            {{- else }}
            - name: ANVILKIT_FORWARDER_NATS_TLS_CA_FILE
              value: /etc/anvilkit/nats-ca/ca.crt
            {{- end }}
            {{- if eq .Values.nats.tls.mode "mtls" }}
            - name: ANVILKIT_FORWARDER_NATS_TLS_CERT_FILE
              value: /etc/anvilkit/identity/tls.crt
            - name: ANVILKIT_FORWARDER_NATS_TLS_KEY_FILE
              value: /etc/anvilkit/identity/tls.key
            {{- end }}
          ports:
            - name: fwd-health
              containerPort: {{ .Values.forwarder.healthPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: fwd-health
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: fwd-health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.forwarder.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.trust.configMap }}
            - name: trust
              mountPath: /etc/anvilkit/trust
              readOnly: true
            {{- end }}
            {{- if $csi }}
            - name: credentials
              mountPath: /var/run/secrets/anvilkit/csi
              readOnly: true
            {{- else }}
            - name: forwarder-database
              mountPath: /var/run/secrets/anvilkit/forwarder-database
              readOnly: true
            {{- if .Values.nats.credentials.secret.name }}
            - name: nats-credentials
              mountPath: /var/run/secrets/anvilkit/nats
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if ne .Values.nats.tls.mode "development" }}
            - name: nats-ca
              mountPath: /etc/anvilkit/nats-ca
              readOnly: true
            {{- end }}
            {{- if eq .Values.nats.tls.mode "mtls" }}
            - name: identity
              mountPath: /etc/anvilkit/identity
              readOnly: true
            {{- end }}
        {{- end }}
        {{- if .Values.relay.enabled }}
        - name: relay
          image: {{ include "anvilkit-agent-knowledge.relayImage" . | quote }}
          imagePullPolicy: {{ .Values.relay.image.pullPolicy }}
          args: ["relay"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ANVILKIT_BACKGROUND_WORKER_CONFIG
              value: /etc/anvilkit/anvilkit-agent-background-worker/config.yaml
            - name: ANVILKIT_BACKGROUND_WORKER_RELAY_OWNER
              value: knowledge
            {{- if .Values.trust.configMap }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/anvilkit/trust/ca.crt
            {{- end }}
            - name: ANVILKIT_BACKGROUND_WORKER_KNOWLEDGE_ADDRESS
              value: {{ printf "127.0.0.1:%d" (int .Values.listen.port) | quote }}
            - name: ANVILKIT_BACKGROUND_WORKER_HEALTH_LISTEN
              value: {{ printf "%s:%d" .Values.listen.address (int .Values.relay.healthPort) | quote }}
            - name: ANVILKIT_BACKGROUND_WORKER_NATS_URL
              value: {{ .Values.nats.url | quote }}
            # P0.6: the relay's own NATS transport and user.
            - name: ANVILKIT_BACKGROUND_WORKER_NATS_TLS_MODE
              value: {{ .Values.nats.tls.mode | quote }}
            {{- if ne .Values.nats.tls.mode "development" }}
            - name: ANVILKIT_BACKGROUND_WORKER_NATS_TLS_CA_FILE
              value: /etc/anvilkit/nats-ca/ca.crt
            {{- end }}
            {{- if eq .Values.nats.tls.mode "mtls" }}
            - name: ANVILKIT_BACKGROUND_WORKER_NATS_TLS_CERT_FILE
              value: /etc/anvilkit/identity/tls.crt
            - name: ANVILKIT_BACKGROUND_WORKER_NATS_TLS_KEY_FILE
              value: /etc/anvilkit/identity/tls.key
            {{- end }}
            {{- if or $csi .Values.nats.credentials.secret.name }}
            - name: ANVILKIT_BACKGROUND_WORKER_NATS_CREDS_FILE
              value: {{ include "anvilkit-agent-knowledge.credentialFile" (dict "root" . "csi" "relay-nats-creds" "kube" (printf "/var/run/secrets/anvilkit/nats/%s" .Values.nats.credentials.secret.relayKey)) }}
            {{- end }}
            - name: ANVILKIT_BACKGROUND_WORKER_RELAY_DATABASE_URL_FILE
              value: {{ include "anvilkit-agent-knowledge.credentialFile" (dict "root" . "csi" "relay-database-url" "kube" (printf "/var/run/secrets/anvilkit/relay-database/%s" .Values.relay.database.secret.key)) }}
            - name: ANVILKIT_BACKGROUND_WORKER_QUEUE_URL_FILE
              value: {{ include "anvilkit-agent-knowledge.credentialFile" (dict "root" . "csi" "relay-queue-url" "kube" (printf "/var/run/secrets/anvilkit/queue/%s" .Values.relay.queue.secret.key)) }}
            {{- with .Values.relay.queue.tls.caFile }}
            - name: ANVILKIT_BACKGROUND_WORKER_QUEUE_TLS_CA_FILE
              value: {{ . | quote }}
            {{- end }}
            # P0.1: the relay dials this Pod's BackgroundTaskService with the
            # Pod's own workload identity and verifies it by the Service name.
            - name: ANVILKIT_BACKGROUND_WORKER_IDENTITY_MODE
              value: {{ .Values.identity.mode | quote }}
            {{- if eq .Values.identity.mode "mtls" }}
            - name: ANVILKIT_BACKGROUND_WORKER_IDENTITY_CERT_FILE
              value: /etc/anvilkit/identity/tls.crt
            - name: ANVILKIT_BACKGROUND_WORKER_IDENTITY_KEY_FILE
              value: /etc/anvilkit/identity/tls.key
            - name: ANVILKIT_BACKGROUND_WORKER_IDENTITY_CA_FILE
              value: /etc/anvilkit/identity/ca.crt
            - name: ANVILKIT_BACKGROUND_WORKER_OWNER_SERVER_NAME
              value: {{ include "anvilkit-agent-knowledge.fullname" . | quote }}
            {{- end }}
          ports:
            - name: relay-health
              containerPort: {{ .Values.relay.healthPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: relay-health
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: relay-health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.relay.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.trust.configMap }}
            - name: trust
              mountPath: /etc/anvilkit/trust
              readOnly: true
            {{- end }}
            {{- if $csi }}
            - name: credentials
              mountPath: /var/run/secrets/anvilkit/csi
              readOnly: true
            {{- else }}
            - name: relay-database
              mountPath: /var/run/secrets/anvilkit/relay-database
              readOnly: true
            - name: queue
              mountPath: /var/run/secrets/anvilkit/queue
              readOnly: true
            {{- if .Values.nats.credentials.secret.name }}
            - name: nats-credentials
              mountPath: /var/run/secrets/anvilkit/nats
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if eq .Values.identity.mode "mtls" }}
            - name: identity
              mountPath: /etc/anvilkit/identity
              readOnly: true
            {{- end }}
            {{- if ne .Values.nats.tls.mode "development" }}
            - name: nats-ca
              mountPath: /etc/anvilkit/nats-ca
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "anvilkit-agent-knowledge.fullname" . }}
        {{- if .Values.trust.configMap }}
        - name: trust
          configMap:
            name: {{ .Values.trust.configMap }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        {{- if eq .Values.identity.mode "mtls" }}
        - name: identity
          secret:
            secretName: {{ include "anvilkit-agent-knowledge.identitySecret" . }}
            defaultMode: 0440
        {{- end }}
        {{- if ne .Values.nats.tls.mode "development" }}
        - name: nats-ca
          secret:
            secretName: {{ .Values.nats.tls.caSecret.name }}
            items:
              - key: {{ .Values.nats.tls.caSecret.key }}
                path: ca.crt
        {{- end }}
        {{- if and .Values.inference.url (ne .Values.inference.tls.mode "development") }}
        - name: inference-ca
          secret:
            secretName: {{ .Values.inference.tls.caSecret.name }}
            items:
              - key: {{ .Values.inference.tls.caSecret.key }}
                path: ca.crt
        {{- end }}
        {{- if eq .Values.secrets.provider "csi" }}
        - name: credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "anvilkit-agent-knowledge.fullname" . }}
        {{- else }}
        - name: database
          secret:
            secretName: {{ .Values.database.secret.name }}
        {{- if .Values.objects.endpoint }}
        - name: objects
          secret:
            secretName: {{ required "objects.credentials.secret.name is required with objects.endpoint" .Values.objects.credentials.secret.name }}
        {{- end }}
        {{- if .Values.removals.endpoint }}
        - name: removals
          secret:
            secretName: {{ required "removals.credentials.secret.name is required with removals.endpoint" .Values.removals.credentials.secret.name }}
        {{- end }}
        {{- if .Values.nats.credentials.secret.name }}
        - name: nats-credentials
          secret:
            secretName: {{ .Values.nats.credentials.secret.name }}
            defaultMode: 0440
        {{- end }}
        {{- end }}
        {{- if .Values.parser.enabled }}
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
        {{- if and (not $csi) .Values.forwarder.enabled }}
        - name: forwarder-database
          secret:
            secretName: {{ .Values.forwarder.database.secret.name }}
        {{- end }}
        {{- if and (not $csi) .Values.relay.enabled }}
        - name: relay-database
          secret:
            secretName: {{ .Values.relay.database.secret.name }}
        - name: queue
          secret:
            secretName: {{ .Values.relay.queue.secret.name }}
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
