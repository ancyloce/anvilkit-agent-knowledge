# Chart values of anvilkit-agent-knowledge. Only what this service needs:
# its image, its reviewed configuration file, the allowlisted placement
# overrides, the Secrets it reads its credentials from, probes, resources
# and its two sidecars of P14 — the Go outbox forwarder (the forwarder
# target of this repository's image, run with the forwarder role: message
# read and offset write only) and the owner queue relay (the
# background-worker image's relay entry, run with the relay role). Environment
# values are supplied by the deploying repository; secrets never enter this chart.

image:
  repository: anvilkit-agent-knowledge
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 2

# HorizontalPodAutoscaler (autoscaling/v2). Off unless the environment enables
# it with an explicit maxReplicas: the maximum is bounded by downstream caps
# and the database connection budget (deploy/gitops/lock.yaml), never a chart
# default. While enabled the Deployment leaves replicas to the autoscaler.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 0
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

# The gRPC listener inside the Pod (ANVILKIT_KNOWLEDGE_LISTEN): under
# identity.mode mtls it is mTLS-only; the kubelet probes the health port.
listen:
  address: 0.0.0.0
  port: 9105
# The plaintext HTTP probe listener (/healthz, /readyz, /metrics); never a
# business endpoint, not exposed by the Service.
health:
  port: 9115

# The listener's workload identity (P0.1): mtls (the default) serves TLS 1.3
# with required client certificates verified against the mounted CA bundle
# and authorizes every RPC by the peer's SPIFFE URI SAN under the reviewed
# allowlist; the same certificate is the Control client's identity. The
# certificate is a cert-manager Certificate this chart renders
# (certificate.create) from issuerRef, or an existing Secret (secretName,
# keys tls.crt, tls.key, ca.crt); the files are mounted at
# /etc/anvilkit/identity into the knowledge container and the relay sidecar
# and reloaded as a whole. development is the plaintext listener of the
# development foundation and renders only with development.enabled: true.
identity:
  mode: mtls
  trustDomain: ""
  secretName: ""
  certificate:
    create: true
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    duration: 2160h
    renewBefore: 720h
  maxConnectionAge: 1h

# The top-level DEVELOPMENT_ONLY guard: every development transport below
# (identity.mode, control.identity.mode, inference.tls.mode, nats.tls.mode)
# renders only while this is true; it downgrades nothing by itself.
development:
  enabled: false

# The application-role connection, mounted as a file
# (ANVILKIT_KNOWLEDGE_DATABASE_URL_FILE) so a rotated secret publishes a new
# configuration generation without a restart. Required; never created here.
database:
  secret:
    name: ""
    key: url

# Credential delivery (P0.6). kubernetes mounts the existing Secrets named
# in this file (database, objects, removals, qdrant.apiKeySecret,
# store.secret, nats.credentials, forwarder.database, relay.database,
# relay.queue): the development foundation's path. csi mounts the
# credentials from OpenBao through the Secrets Store CSI driver (provider
# openbao, Kubernetes auth with the Pod's ServiceAccount token of audience
# csi.audience; no Kubernetes Secret is synced) read-only at
# /var/run/secrets/anvilkit/csi in the containers that read them. The
# service's KV v2 path holds database-url, objects-credentials,
# removals-credentials, qdrant-api-key and store-database-url (Knowledge),
# forwarder-database-url and nats-creds (forwarder), relay-database-url,
# relay-queue-url and relay-nats-creds (relay), each key only while its
# feature is configured.
secrets:
  provider: kubernetes
  csi:
    address: ""
    caCertPath: ""
    audience: openbao
    role: ""
    path: ""

# P0.6: the data plane's CA bundle: a ConfigMap (key ca.crt) in this
# namespace, e.g. the anvilkit-trust map deploy/qualification/bootstrap.py
# maintains. Mounted at /etc/anvilkit/trust in every container that connects
# to PostgreSQL (the DSNs' sslrootcert names /etc/anvilkit/trust/ca.crt) or
# an HTTPS data store, and added to the Node processes' roots
# (NODE_EXTRA_CA_CERTS). Empty: the image's roots only.
trust:
  configMap: ""

# The JetStream placement (forwarder and relay). Required. tls is the
# forwarder's transport: tls verifies the server against caSecret (key
# ca.crt), mtls also presents the workload certificate, development is the
# plaintext JetStream of the development foundation (development.enabled).
nats:
  url: ""
  tls:
    mode: tls
    caSecret:
      name: ""
      key: ca.crt
  # The NATS user credentials (P0.6): an NKey seed or a .creds file each for
  # the forwarder (ANVILKIT_FORWARDER_NATS_CREDS_FILE) and the relay
  # (ANVILKIT_BACKGROUND_WORKER_NATS_CREDS_FILE); under secrets.provider
  # kubernetes an existing Secret with the two keys below, required outside
  # development (the server admits no anonymous client).
  credentials:
    secret:
      name: ""
      forwarderKey: forwarder
      relayKey: relay

# The Control placement of the original-dispatch query; optional. The client
# presents the workload certificate and verifies Control by serverName.
control:
  address: ""
  identity:
    mode: mtls
    serverName: anvilkit-agent-control

# P15: Knowledge's object store (the anvilkit-knowledge bucket, its own
# user and bucket-limited policy): the in-cluster endpoint, the endpoint
# parser Pods reach through presigned URLs (defaults to the first), and an
# existing Secret holding a KEY=VALUE file with the ACCESS_KEY_ID and
# SECRET_ACCESS_KEY lines. Empty endpoint: no source registration.
objects:
  endpoint: ""
  stageEndpoint: ""
  credentials:
    secret:
      name: ""
      key: credentials

# P23: the removal inventory in the independent DR store (its own bucket,
# user and bucket-limited policy): the endpoint and an existing Secret
# holding a KEY=VALUE file with the ACCESS_KEY_ID and SECRET_ACCESS_KEY
# lines. Empty endpoint: deletions and revocations are not preserved across
# a database restore (the service warns).
removals:
  endpoint: ""
  credentials:
    secret:
      name: ""
      key: credentials

# P15: the parser launcher. enabled renders the least Role and RoleBinding
# in the parser namespace and mounts an expiring API token into the
# knowledge container only; config.parser.profile names the reviewed
# parser profile (contracts/jobs) and imageRegistry completes its image.
parser:
  enabled: false
  namespace: anvilkit-parsing
  imageRegistry: ""

# P15: the Inference placement (anvilkit-agent-inference); optional. tls is
# its transport: tls verifies the server against caSecret (key ca.crt) by
# serverName (the URL host by default), mtls also presents the workload
# certificate, development is plaintext http:// (development.enabled).
# Server-side TLS of Inference is P0.6.
inference:
  url: ""
  tls:
    mode: tls
    serverName: ""
    caSecret:
      name: ""
      key: ca.crt

# P16: the Qdrant placement (ANVILKIT_KNOWLEDGE_QDRANT_URL) and, when the
# cluster requires one, its API key from an existing Secret. The collection's
# replication and write-consistency factors are configuration (config.qdrant).
qdrant:
  url: ""
  apiKeySecret:
    name: ""
    key: apiKey

# P17: the PostgresStore projection's own database identity
# (ANVILKIT_KNOWLEDGE_STORE_DATABASE_URL) from an existing Secret. Without it
# the memory projection is not configured. An environment variable is read at
# start: rotating it rolls the Pods (the app-role URL file reloads in place).
store:
  # Under secrets.provider csi: whether the projection is configured (its
  # URL is the store-database-url key); under kubernetes store.secret.name.
  enabled: false
  secret:
    name: ""
    key: url

# P2.7: the cleanup identity (anvilkit_knowledge_cleanup: DELETE on chunk and
# delivery rows only) of the erasure of deleted sources and the retention of
# delivery rows. Under secrets.provider csi: whether it is configured (its URL
# is the cleanup-database-url key); under kubernetes cleanup.secret.name.
# Without it nothing is erased or pruned (a warning at start).
cleanup:
  enabled: false
  secret:
    name: ""
    key: url

# The outbox forwarder sidecar: its own database identity
# (anvilkit_knowledge_forwarder: SELECT on outbox, SELECT/INSERT/UPDATE on
# outbox_offsets, nothing else), read from an existing Secret.
forwarder:
  enabled: true
  image:
    repository: anvilkit-knowledge-forwarder
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  database:
    secret:
      name: ""
      key: url
  healthPort: 9125
  consumerGroup: anvilkit-agent-knowledge-forwarder
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

# The owner queue relay sidecar (see the MCP chart for the same container).
relay:
  enabled: true
  image:
    repository: anvilkit-agent-background-worker
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  database:
    secret:
      name: ""
      key: url
  queue:
    secret:
      name: ""
      key: url
    # The queue Valkey's CA inside the Pod for a rediss:// URL
    # (ANVILKIT_BACKGROUND_WORKER_QUEUE_TLS_CA_FILE), e.g. the cluster CA of
    # the workload identity /etc/anvilkit/identity/ca.crt; empty uses the
    # image's roots.
    tls:
      caFile: ""
  healthPort: 9126
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

config:
  grpc:
    listen: 127.0.0.1:9105
    capacity: 64
    shutdown_timeout: 20s
  health:
    listen: 127.0.0.1:9115
  database:
    max_conn: 8
  tasks:
    max_input_bytes: 65536
    max_lease: 10m
    retry_delay: 5s
    max_attempts: 3
    sweep_interval: 2s
  outbox:
    consumer_group: anvilkit-agent-knowledge-forwarder
  control:
    timeout: 5s
  apollo:
    mode: disabled
    app_id: anvilkit-agent-knowledge
  reload:
    interval: 2s
    drain_limit: 30s
  objects:
    bucket: anvilkit-knowledge
    region: us-east-1
  sources:
    max_bytes: 33554432
  parser:
    profile: ""
    namespace: anvilkit-parsing
    node_pool: parsing
    seccomp_profile: anvilkit/candidate.json
    poll_interval: 1s
    deadline_grace: 30s
    presign_ttl: 15m
    kube_timeout: 10s
  inference:
    timeout: 30s
    max_batch: 32
    embedding_profile: bge-m3-v1
    embedding_revision: 5617a9f61b028005a4858fdac845db406aefb181
    dimensions: 1024
    rerank_profile: bge-reranker-v2-m3-v1
    rerank_revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e

service:
  type: ClusterIP
  port: 9105

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 30
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

terminationGracePeriodSeconds: 90

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# A voluntary disruption (node drain, rollout) keeps at least one Pod serving.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Telemetry placement (P23): the collector's OTLP/HTTP base URL for spans
# (ANVILKIT_KNOWLEDGE_TELEMETRY_OTLP_ENDPOINT); empty disables it. The metrics are on
# the health listener's /metrics; scraping is the environment's pod annotations.
telemetry:
  otlpEndpoint: ""
