# Chart values of anvilkit-agent-knowledge. Only what this service needs:
# its image, its reviewed configuration file, the allowlisted placement
# overrides, the Secrets it reads its credentials from, probes, resources
# and its two sidecars of P14 — the Go outbox forwarder (the forwarder
# target of this repository's image, run with the forwarder role: message
# read and offset write only) and the owner queue relay (the
# background-worker image's relay entry, run with the relay role). Environment
# values are supplied by the deploying repository; secrets never enter this chart.

image:
  repository: anvilkit-agent-knowledge
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 2

# HorizontalPodAutoscaler (autoscaling/v2). Off unless the environment enables
# it with an explicit maxReplicas: the maximum is bounded by downstream caps
# and the database connection budget (deploy/gitops/lock.yaml), never a chart
# default. While enabled the Deployment leaves replicas to the autoscaler.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 0
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

listen:
  address: 0.0.0.0
  port: 9105
health:
  port: 9115

# The application-role connection, mounted as a file
# (ANVILKIT_KNOWLEDGE_DATABASE_URL_FILE) so a rotated secret publishes a new
# configuration generation without a restart. Required; never created here.
database:
  secret:
    name: ""
    key: url

# The JetStream placement (forwarder and relay). Required.
nats:
  url: ""

# The Control placement of the original-dispatch query; optional.
control:
  address: ""

# P15: Knowledge's object store (the anvilkit-knowledge bucket, its own
# user and bucket-limited policy): the in-cluster endpoint, the endpoint
# parser Pods reach through presigned URLs (defaults to the first), and an
# existing Secret holding a KEY=VALUE file with the ACCESS_KEY_ID and
# SECRET_ACCESS_KEY lines. Empty endpoint: no source registration.
objects:
  endpoint: ""
  stageEndpoint: ""
  credentials:
    secret:
      name: ""
      key: credentials

# P23: the removal inventory in the independent DR store (its own bucket,
# user and bucket-limited policy): the endpoint and an existing Secret
# holding a KEY=VALUE file with the ACCESS_KEY_ID and SECRET_ACCESS_KEY
# lines. Empty endpoint: deletions and revocations are not preserved across
# a database restore (the service warns).
removals:
  endpoint: ""
  credentials:
    secret:
      name: ""
      key: credentials

# P15: the parser launcher. enabled renders the least Role and RoleBinding
# in the parser namespace and mounts an expiring API token into the
# knowledge container only; config.parser.profile names the reviewed
# parser profile (contracts/jobs) and imageRegistry completes its image.
parser:
  enabled: false
  namespace: anvilkit-parsing
  imageRegistry: ""

# P15: the Inference placement (anvilkit-agent-inference); optional.
inference:
  url: ""

# P16: the Qdrant placement (ANVILKIT_KNOWLEDGE_QDRANT_URL) and, when the
# cluster requires one, its API key from an existing Secret. The collection's
# replication and write-consistency factors are configuration (config.qdrant).
qdrant:
  url: ""
  apiKeySecret:
    name: ""
    key: apiKey

# P17: the PostgresStore projection's own database identity
# (ANVILKIT_KNOWLEDGE_STORE_DATABASE_URL) from an existing Secret. Without it
# the memory projection is not configured. An environment variable is read at
# start: rotating it rolls the Pods (the app-role URL file reloads in place).
store:
  secret:
    name: ""
    key: url

# The outbox forwarder sidecar: its own database identity
# (anvilkit_knowledge_forwarder: SELECT on outbox, SELECT/INSERT/UPDATE on
# outbox_offsets, nothing else), read from an existing Secret.
forwarder:
  enabled: true
  image:
    repository: anvilkit-knowledge-forwarder
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  database:
    secret:
      name: ""
      key: url
  healthPort: 9125
  consumerGroup: anvilkit-agent-knowledge-forwarder
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

# The owner queue relay sidecar (see the MCP chart for the same container).
relay:
  enabled: true
  image:
    repository: anvilkit-agent-background-worker
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  database:
    secret:
      name: ""
      key: url
  queue:
    secret:
      name: ""
      key: url
  healthPort: 9126
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

config:
  grpc:
    listen: 127.0.0.1:9105
    capacity: 64
    shutdown_timeout: 20s
  health:
    listen: 127.0.0.1:9115
  database:
    max_conn: 8
  tasks:
    max_input_bytes: 65536
    max_lease: 10m
    retry_delay: 5s
    max_attempts: 3
    sweep_interval: 2s
  outbox:
    consumer_group: anvilkit-agent-knowledge-forwarder
  control:
    timeout: 5s
  apollo:
    mode: disabled
    app_id: anvilkit-agent-knowledge
  reload:
    interval: 2s
    drain_limit: 30s
  objects:
    bucket: anvilkit-knowledge
    region: us-east-1
  sources:
    max_bytes: 33554432
  parser:
    profile: ""
    namespace: anvilkit-parsing
    node_pool: parsing
    seccomp_profile: anvilkit/candidate.json
    poll_interval: 1s
    deadline_grace: 30s
    presign_ttl: 15m
    kube_timeout: 10s
  inference:
    timeout: 30s
    max_batch: 32
    embedding_profile: bge-m3-v1
    embedding_revision: 5617a9f61b028005a4858fdac845db406aefb181
    dimensions: 1024
    rerank_profile: bge-reranker-v2-m3-v1
    rerank_revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e

service:
  type: ClusterIP
  port: 9105

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 30
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

terminationGracePeriodSeconds: 90

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# A voluntary disruption (node drain, rollout) keeps at least one Pod serving.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Telemetry placement (P23): the collector's OTLP/HTTP base URL for spans
# (ANVILKIT_KNOWLEDGE_TELEMETRY_OTLP_ENDPOINT); empty disables it. The metrics are on
# the health listener's /metrics; scraping is the environment's pod annotations.
telemetry:
  otlpEndpoint: ""
